name: MoveInSync Ratings Pulse Weekly Automation

on:
  schedule:
    # Runs every Monday at 03:00 UTC (08:30 AM IST)
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-ratings-pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-play-scraper pandas tabulate

      - name: Execute Ratings Pulse Telemetry Engine
        run: |
          python ratings_pulse/ratings_pulse.py --app com.moveinsync.ets --count 1500 --out pulse_reports

      - name: Commit & Publish Weekly Ratings Digest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Ratings Pulse]"
          git add pulse_reports/
          if git diff-index --quiet HEAD --; then
            echo "No new changes to commit."
          else
            git commit -m "chore(telemetry): automated weekly Ratings Pulse digest [$(date +'%Y-%m-%d')]"
            git push
          fi
